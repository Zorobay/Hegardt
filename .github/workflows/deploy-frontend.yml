name: Deploy Frontend 💻

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint frontends
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (all workspaces)
        run: npm run lint --workspaces --if-present

  build-and-deploy:
    name: Build & deploy frontends
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build hegardt.se
        run: npm run build -w vue
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Build sebastian.hegardt.se
        run: npm run build -w sebastian

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 2223 -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Ensure target directories exist
        run: |
          ssh -i ~/.ssh/deploy_key -p 2223 root@${{ secrets.SERVER_IP }} \
            'mkdir -p /root/Hegardt/vue/dist /root/Hegardt/sebastian/dist'

      - name: Sync dists to server
        run: |
          RSYNC_SSH="ssh -i ~/.ssh/deploy_key -p 2223"
          rsync -az --delete -e "$RSYNC_SSH" vue/dist/       root@${{ secrets.SERVER_IP }}:/root/Hegardt/vue/dist/
          rsync -az --delete -e "$RSYNC_SSH" sebastian/dist/ root@${{ secrets.SERVER_IP }}:/root/Hegardt/sebastian/dist/